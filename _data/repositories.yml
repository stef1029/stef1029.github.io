# Drives the /repositories/ page: repo cards fetched live from the
# github-readme-stats instance configured in _config.yml.
#
# `github_users` is deliberately omitted — that key renders the "GitHub users"
# profile-stats card at the top of the page. Add it back as a list of usernames
# if you ever want it:
#   github_users:
#     - stef1029

repo_description_lines_max: 2

# ONLY PUBLIC REPOS RENDER. The stats service fetches these anonymously, so a
# private repo shows as a broken/empty card.
#
# Ordered by genuine code activity (most recent first, as of 14 Aug 2026) rather
# than GitHub's `updatedAt`, which counts metadata edits too — setting all seven
# descriptions on 14 Aug reset that field across the board.
#
# All seven now carry a description on GitHub, which is what the cards display.
# Keep them updated with `gh repo edit stef1029/<name> --description "..."`.
github_repos:
  - stef1029/trilab-floating-platform
  - stef1029/HexControl
  - stef1029/Head-sensor-internal-code
  - stef1029/behaviour_camera
  - stef1029/Head-sensor-experiment-control
  - stef1029/Smart-opto-stim-board
  - stef1029/WormTrackatron7000
